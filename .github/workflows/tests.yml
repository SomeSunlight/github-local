name: Python tests
on:
  push:
    branches: [issue-20-git-tracked-workflow-state]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install uv for actual Git-URL install smoke test
        if: github.event_name == 'push'
        run: python -m pip install uv
      - name: Verify installed Git commit identity through uv tool
        if: github.event_name == 'push'
        shell: bash
        run: |
          export UV_TOOL_DIR="${RUNNER_TEMP}/uv-tools"
          export UV_TOOL_BIN_DIR="${RUNNER_TEMP}/uv-bin"
          uv tool install --force --python "$(command -v python)" "git+https://github.com/SomeSunlight/github-local.git@${GITHUB_SHA}"
          actual="$("${UV_TOOL_BIN_DIR}/github-local" --version)"
          echo "$actual"
          expected="github-local 0.1.0 (detached@${GITHUB_SHA:0:7})"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected installed Git provenance: $expected" >&2
            exit 1
          fi
