name: Python tests
on:
  push:
    branches: [main, 'agent/**', 'fix/**', 'issue-*']
  pull_request:
    branches: [main]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify Windows smoke cleanup under directory locks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke-cleanup.ps1
      - name: Verify accepted ContextCanon packages on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install "git+https://github.com/SomeSunlight/context-canon.git@5a1f2bff24a9f6c6af49d96044eaf15b80d0d0b6"
          contextcanon check --all .
      - name: Install uv for actual Git-URL install smoke test
        if: github.event_name == 'push' && runner.os == 'Linux'
        run: python -m pip install uv
      - name: Verify installed Git commit identity through uv tool
        if: github.event_name == 'push' && runner.os == 'Linux'
        shell: bash
        run: |
          export UV_TOOL_DIR="${RUNNER_TEMP}/uv-tools"
          export UV_TOOL_BIN_DIR="${RUNNER_TEMP}/uv-bin"
          uv tool install --force --python "$(command -v python)" "git+https://github.com/SomeSunlight/github-local.git@${GITHUB_SHA}"
          actual="$("${UV_TOOL_BIN_DIR}/github-local" --version)"
          echo "$actual"
          release="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          expected="github-local ${release} (detached@${GITHUB_SHA:0:7})"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected installed Git provenance: $expected" >&2
            exit 1
          fi
          # The moving-branch metadata must identify the branch actually tested.
          uv tool install --force --refresh --python "$(command -v python)" "git+https://github.com/SomeSunlight/github-local.git@${GITHUB_REF_NAME}"
          branch_version="$("${UV_TOOL_BIN_DIR}/github-local" --version)"
          echo "$branch_version"
          python - "$GITHUB_REF_NAME" "$release" "$branch_version" <<'PY'
          import re
          import sys
          branch, release, output = sys.argv[1:]
          expected = rf"github-local {re.escape(release)} \({re.escape(branch)}@[0-9a-f]{{7}}\)"
          if not re.fullmatch(expected, output):
              raise SystemExit("Git branch install did not preserve ref and exact commit")
          PY
