# Temporary branch-only CI: review, test and accept exact shared Context. Remove after publication.
name: Issue 25 self-hosted verification
on:
  push:
    branches:
      - agent/25-opt-in-version-check
permissions:
  contents: write
jobs:
  verify-and-accept:
    if: github.ref == 'refs/heads/agent/25-opt-in-version-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check focused and complete Python regression suite
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH=src
          python -m unittest tests.test_version tests.test_version_check -v
          python -m unittest discover -s tests -v
      - name: Install accepted ContextCanon main revision
        shell: bash
        run: |
          python -m pip install "git+https://github.com/SomeSunlight/context-canon.git@5a1f2bff24a9f6c6af49d96044eaf15b80d0d0b6"
      - name: Explicit Source review/acceptance and self-hosted check
        shell: bash
        run: |
          set -euxo pipefail
          contextcanon source update GitHub --node . --ref 5a1f2bff24a9f6c6af49d96044eaf15b80d0d0b6 --yes
          contextcanon build --all .
          contextcanon check --all .
          export PYTHONPATH=src
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit only to the review branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Accept updated GitHub and Development Workflow Context (#25)"
            git push origin HEAD:refs/heads/agent/25-opt-in-version-check
          fi
